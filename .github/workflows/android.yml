name: Android
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '15859902'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: |
          python -m pip install Babel==2.17.0 Flask==3.1.3
          python -m unittest discover -s upstream/tests/unit -p test_phone_mics.py
          python -m unittest discover -s upstream/tests/unit -p test_song_storage.py
          javac -d "$RUNNER_TEMP/mic-check" upstream/integrations/android/src/main/java/org/pikaraoke/tv/PhoneMicBuffer.java upstream/integrations/android/src/main/java/org/pikaraoke/tv/PhoneMicOutput.java upstream/integrations/android/tests/PhoneMicBufferCheck.java upstream/integrations/android/tests/PhoneMicLatencyCheck.java
          java -cp "$RUNNER_TEMP/mic-check" PhoneMicBufferCheck
          java -cp "$RUNNER_TEMP/mic-check" PhoneMicLatencyCheck
          npm install --prefix "$RUNNER_TEMP/mic-browser" --ignore-scripts --no-audit --no-fund jsdom@26.1.0
          NODE_PATH="$RUNNER_TEMP/mic-browser/node_modules" node upstream/tests/phone-mic-client.test.cjs
          NODE_PATH="$RUNNER_TEMP/mic-browser/node_modules" node upstream/tests/song-storage-client.test.cjs
          sdkmanager 'platforms;android-37.2' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
          echo "PIKARAOKE_BUILD_PYTHON=$(command -v python3)" >> "$GITHUB_ENV"
      - run: ./gradlew assembleDebug assembleDebugAndroidTest --console=plain
      - uses: actions/upload-artifact@v7
        with:
          name: debug-apks
          path: app/build/outputs/apk/debug/*.apk
  device-test:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - name: Make room for the Android TV image and APKs
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '15859902'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: |
          python -m pip install Babel==2.17.0
          sdkmanager 'platforms;android-37.2' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
          echo "PIKARAOKE_BUILD_PYTHON=$(command -v python3)" >> "$GITHUB_ENV"
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          pre-emulator-launch-script: adb start-server
          api-level: 36
          target: android-tv
          arch: x86_64
          profile: tv_1080p
          disk-size: 2048M
          ram-size: 2048M
          script: bash scripts/run_device_checks.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: device-test-reports
          path: app/build/reports/androidTests/
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: tv-screenshots
          path: tv-screenshots/
