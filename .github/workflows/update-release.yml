name: "Update and release Android"
"on":
  schedule:
    - cron: "23 8 * * 1"
  workflow_dispatch:
    inputs:
      force_release:
        description: "Build a signed APK even when dependency pins are unchanged"
        type: "boolean"
        default: false
  push:
    branches:
      - "main"
    paths:
      - "upstream"
      - "app/**"
      - "scripts/**"
      - "tests/**"
      - "gradle/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - "version.json"
      - "ytdlp.json"
      - ".github/workflows/update-release.yml"
permissions:
  contents: "read"
concurrency:
  group: "android-automatic-release"
  cancel-in-progress: false
jobs:
  prepare:
    if: "github.repository == 'nabekhan/pikaraoke-android' && github.ref == 'refs/heads/main'"
    runs-on: "ubuntu-24.04"
    timeout-minutes: 15
    outputs:
      publish: "${{ steps.plan.outputs.publish }}"
      repair_latest: "${{ steps.plan.outputs.repair_latest }}"
      base_sha: "${{ steps.plan.outputs.base_sha }}"
    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"
        with:
          ref: "main"
          persist-credentials: false
      - uses: "actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065"
        with:
          python-version: "3.11"
      - name: "Validate automation and workflow boundaries"
        run: |
          python -m unittest discover -s tests -p test_automation.py
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
      - name: "Install the requirement metadata parser"
        run: "python -m pip install packaging==26.3"
      - name: "Check upstream and plan a versioned update"
        id: "plan"
        env:
          GH_TOKEN: "${{ github.token }}"
          FORCE_RELEASE: "${{ github.event_name == 'push' || inputs.force_release }}"
        run: |
          args=()
          if [ "$FORCE_RELEASE" = true ]; then args+=(--force); fi
          python scripts/automation.py plan "$RUNNER_TEMP/update-plan.json" "${args[@]}"
      - uses: "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02"
        with:
          name: "release-plan"
          path: "${{ runner.temp }}/update-plan.json"
          retention-days: 7
          if-no-files-found: "error"
          overwrite: true
  repair-latest:
    needs: "prepare"
    if: "needs.prepare.outputs.repair_latest == 'true'"
    runs-on: "ubuntu-24.04"
    timeout-minutes: 5
    permissions:
      contents: "write"
    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"
        with:
          ref: "${{ needs.prepare.outputs.base_sha }}"
          persist-credentials: false
      - uses: "actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093"
        with:
          name: "release-plan"
          path: "${{ runner.temp }}/plan"
      - name: "Verify existing assets and restore the latest download"
        env:
          GH_TOKEN: "${{ github.token }}"
        run: "python3 scripts/release_android.py repair-latest \"$RUNNER_TEMP/plan/update-plan.json\""
  build:
    needs: "prepare"
    if: "needs.prepare.outputs.publish == 'true'"
    runs-on: "ubuntu-24.04"
    timeout-minutes: 45
    steps:
      - name: "Make room for APKs and Android TV"
        run: "sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/local/lib/android/sdk/ndk"
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"
        with:
          ref: "${{ needs.prepare.outputs.base_sha }}"
          persist-credentials: false
          submodules: "recursive"
      - uses: "actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093"
        with:
          name: "release-plan"
          path: "${{ runner.temp }}/plan"
      - uses: "actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3"
        with:
          distribution: "temurin"
          java-version: "17"
      - uses: "actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065"
        with:
          python-version: "3.11"
      - uses: "android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407"
        with:
          cmdline-tools-version: "15859902"
          packages: "platform-tools"
          log-accepted-android-sdk-licenses: false
      - uses: "gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a"
        with:
          cache-read-only: true
      - name: "Apply only the planned source and pin changes"
        run: |
          python scripts/automation.py apply "$RUNNER_TEMP/plan/update-plan.json"
          mkdir -p "$RUNNER_TEMP/pikaraoke-source"
          python scripts/archive_source.py "$RUNNER_TEMP/pikaraoke-source/source-with-upstream.tar.gz"
      - uses: "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02"
        with:
          name: "complete-source"
          path: "${{ runner.temp }}/pikaraoke-source/source-with-upstream.tar.gz"
          retention-days: 7
          if-no-files-found: "error"
          overwrite: true
      - name: "Prepare build and emulator tools"
        run: |
          python -m pip install Babel==2.17.0 Flask==3.1.3
          python -m unittest discover -s tests -p test_phone_mics.py
          javac -d "$RUNNER_TEMP/mic-check" app/src/main/java/org/pikaraoke/tv/PhoneMicBuffer.java tests/PhoneMicBufferCheck.java
          java -cp "$RUNNER_TEMP/mic-check" PhoneMicBufferCheck
          npm install --prefix "$RUNNER_TEMP/mic-browser" --ignore-scripts --no-audit --no-fund jsdom@26.1.0
          NODE_PATH="$RUNNER_TEMP/mic-browser/node_modules" node tests/phone-mic-client.test.cjs
          sdkmanager 'platforms;android-37.2' 'build-tools;36.0.0'
          echo "PIKARAOKE_BUILD_PYTHON=$(command -v python3)" >> "$GITHUB_ENV"
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: "Build unsigned releases and test the actual Android TV app"
        uses: "reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d"
        with:
          api-level: 36
          target: "android-tv"
          arch: "x86_64"
          profile: "tv_1080p"
          disk-size: "2048M"
          ram-size: "2048M"
          script: "bash scripts/run_device_checks.sh assembleRelease lintRelease"
      - uses: "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02"
        with:
          name: "automatic-tv-test-reports"
          path: "app/build/reports/androidTests/"
          retention-days: 7
          if-no-files-found: "error"
          overwrite: true
        if: "always()"
      - uses: "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02"
        with:
          name: "automatic-tv-screenshots"
          path: "tv-screenshots/"
          retention-days: 7
          overwrite: true
        if: "always()"
      - uses: "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02"
        with:
          name: "unsigned-release"
          path: "app/build/outputs/apk/release/*-release-unsigned.apk"
          retention-days: 7
          if-no-files-found: "error"
          overwrite: true
  sign:
    needs:
      - "prepare"
      - "build"
    if: "github.repository == 'nabekhan/pikaraoke-android' && github.ref == 'refs/heads/main'"
    runs-on: "ubuntu-24.04"
    timeout-minutes: 20
    environment: "android-release"
    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"
        with:
          ref: "${{ needs.prepare.outputs.base_sha }}"
          persist-credentials: false
      - uses: "actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3"
        with:
          distribution: "temurin"
          java-version: "17"
      - uses: "android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407"
        with:
          cmdline-tools-version: "15859902"
          packages: "platform-tools"
          log-accepted-android-sdk-licenses: false
      - name: "Install only Android signing tools"
        run: "sdkmanager 'build-tools;36.0.0'"
      - uses: "actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093"
        with:
          name: "release-plan"
          path: "${{ runner.temp }}/plan"
      - uses: "actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093"
        with:
          name: "unsigned-release"
          path: "${{ runner.temp }}/unsigned"
      - name: "Sign and verify without executing upstream code"
        env:
          PIKARAOKE_KEYSTORE_B64: "${{ secrets.PIKARAOKE_KEYSTORE_B64 }}"
          PIKARAOKE_STORE_PASSWORD: "${{ secrets.PIKARAOKE_STORE_PASSWORD }}"
          PIKARAOKE_KEY_PASSWORD: "${{ secrets.PIKARAOKE_KEY_PASSWORD }}"
        run: |
          umask 077
          python3 scripts/release_android.py sign "$RUNNER_TEMP/plan/update-plan.json" "$RUNNER_TEMP/unsigned" "$RUNNER_TEMP/signed"
      - uses: "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02"
        with:
          name: "signed-release"
          path: "${{ runner.temp }}/signed/*"
          retention-days: 7
          if-no-files-found: "error"
          overwrite: true
  publish:
    needs:
      - "prepare"
      - "build"
      - "sign"
    runs-on: "ubuntu-24.04"
    timeout-minutes: 25
    permissions:
      contents: "write"
    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"
        with:
          ref: "${{ needs.prepare.outputs.base_sha }}"
          persist-credentials: false
      - uses: "actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093"
        with:
          name: "release-plan"
          path: "${{ runner.temp }}/plan"
      - uses: "actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093"
        with:
          name: "signed-release"
          path: "${{ runner.temp }}/signed"
      - uses: "actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093"
        with:
          name: "complete-source"
          path: "${{ runner.temp }}/source"
      - name: "Publish verified assets and commit only tested update data"
        env:
          GH_TOKEN: "${{ github.token }}"
        run: "python3 scripts/release_android.py publish \"$RUNNER_TEMP/plan/update-plan.json\" \"$RUNNER_TEMP/signed\" \"$RUNNER_TEMP/source/source-with-upstream.tar.gz\""
