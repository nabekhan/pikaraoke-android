plugins { id 'com.android.application'; id 'com.chaquo.python' }

def androidVersion = new groovy.json.JsonSlurper().parse(rootProject.file('version.json'))

android {
    namespace 'org.pikaraoke.tv'
    ndkVersion '28.2.13676358'
    compileSdk { version = release(37) { minorApiLevel = 2 } }
    sourceSets.main.res.srcDir 'build/generated/ytdlp/res'
    sourceSets.main.res.srcDir 'build/generated/branding/res'
    sourceSets.main.assets.srcDir 'build/generated/notices'
    defaultConfig {
        applicationId 'org.pikaraoke.tv'
        minSdk 26
        targetSdk 35
        versionCode (androidVersion.version_code as int)
        versionName androidVersion.version_name
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64' }
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        externalNativeBuild { cmake { arguments '-DANDROID_STL=none' } }
    }
    externalNativeBuild {
        cmake {
            path rootProject.file('app/src/main/c/CMakeLists.txt')
            version '3.22.1'
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    packaging {
        jniLibs { useLegacyPackaging = true }
        resources {
            merges += ['META-INF/LICENSE.md', 'META-INF/NOTICE.md']
            excludes += ['META-INF/versions/**', 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA']
        }
    }
    splits { abi { enable true; reset(); include 'arm64-v8a', 'armeabi-v7a', 'x86_64'; universalApk true } }
    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('PIKARAOKE_KEYSTORE')) {
                signingConfigs.create('distribution') {
                    storeFile file(System.getenv('PIKARAOKE_KEYSTORE'))
                    storePassword System.getenv('PIKARAOKE_STORE_PASSWORD')
                    keyAlias System.getenv('PIKARAOKE_KEY_ALIAS') ?: 'pikaraoke'
                    keyPassword System.getenv('PIKARAOKE_KEY_PASSWORD')
                }
                signingConfig signingConfigs.distribution
            }
        }
    }
}

chaquopy {
    defaultConfig {
        version = '3.11'
        if (System.getenv('PIKARAOKE_BUILD_PYTHON')) buildPython(System.getenv('PIKARAOKE_BUILD_PYTHON'))
        pip { install '-r', 'requirements-android.txt' }
        extractPackages 'pikaraoke'
    }
    sourceSets { main { srcDir 'build/generated/python' } }
}
tasks.register('prepareUpstream', Exec) {
    workingDir rootDir
    commandLine System.getenv('PIKARAOKE_BUILD_PYTHON') ?: 'python3', 'scripts/prepare_upstream.py'
    inputs.dir rootProject.file('upstream/pikaraoke')
    inputs.dir rootProject.file('app/src/main/phone-microphones')
    inputs.file rootProject.file('scripts/prepare_upstream.py')
    inputs.file rootProject.file('app/src/main/assets/android-tv.js')
    outputs.dir layout.buildDirectory.dir('generated/python')
}
tasks.matching { it.name == 'generateReleasePythonRequirements' || it.name == 'generateDebugPythonRequirements' || it.name.contains('PythonSources') }.configureEach { dependsOn 'prepareUpstream' }
tasks.register('prepareDownloader', Exec) {
    workingDir rootDir
    commandLine System.getenv('PIKARAOKE_BUILD_PYTHON') ?: 'python3', 'scripts/fetch_ytdlp.py'
    inputs.file rootProject.file('scripts/fetch_ytdlp.py')
    inputs.file rootProject.file('ytdlp.json')
    outputs.dir layout.buildDirectory.dir('generated/ytdlp/res')
}
tasks.register('prepareNotices', Copy) {
    from rootProject.file('LICENSE'), rootProject.file('THIRD_PARTY.md')
    into layout.buildDirectory.dir('generated/notices/licenses')
}
tasks.register('prepareIcons', Exec) {
    workingDir rootDir
    commandLine System.getenv('PIKARAOKE_BUILD_PYTHON') ?: 'python3', 'scripts/prepare_icons.py'
    inputs.file rootProject.file('scripts/prepare_icons.py')
    inputs.file rootProject.file('upstream/pikaraoke/static/icons/logo.ico')
    outputs.dir layout.buildDirectory.dir('generated/branding/res')
}
tasks.named('preBuild') { dependsOn 'prepareUpstream', 'prepareDownloader', 'prepareNotices', 'prepareIcons' }

dependencies {
    implementation 'io.github.webrtc-sdk:android-prefixed-stripped:150.7871.01'
    implementation 'org.bouncycastle:bcpkix-jdk18on:1.86'
    implementation 'org.mozilla.geckoview:geckoview:158.0.20261007201254'
    implementation 'io.github.junkfood02.youtubedl-android:library:0.18.1'
    implementation 'io.github.junkfood02.youtubedl-android:ffmpeg:0.18.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
